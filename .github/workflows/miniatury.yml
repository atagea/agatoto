name: Miniatury zdjęć
on:
  push:
    branches: [main]
    paths: ['images/*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  miniatury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/miniatury.py
      - name: Zapisz miniatury
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/thumbs images/medium
          git diff --cached --quiet || (git commit -m "Miniatury: automatyczna aktualizacja" && git push)
