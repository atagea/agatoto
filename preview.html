<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KWESTIA ZŁUDZEŃ — Kadry</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><style>:root{color-scheme:dark;--bg:#111114;--panel:#1d1c20;--line:#37333a;--txt:#f4eff0;--muted:#aaa1aa;--pink:#eab1c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Arial}a{color:var(--pink)}button,input,select,textarea{font:inherit}button{background:#302b33;border:1px solid #4b414b;color:var(--txt);padding:10px 14px;border-radius:9px;cursor:pointer}button.primary{background:var(--pink);color:#24151d;font-weight:700}button:hover{filter:brightness(1.12)}input,select,textarea{background:#151418;border:1px solid #49414a;color:var(--txt);padding:10px;border-radius:8px;width:100%}textarea{min-height:145px;resize:vertical}header{padding:24px 5vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px;letter-spacing:.03em}h1 em{color:var(--pink);font-family:Georgia,serif}small,.muted{color:var(--muted)}main{max-width:1300px;margin:auto;padding:30px 5vw}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.card img,.placeholder{width:100%;height:255px;object-fit:cover;display:block}.placeholder{display:grid;place-items:center;color:#8d808c;background:linear-gradient(135deg,#252126,#17171b);text-align:center;padding:20px}.card section{padding:15px}.card h3{font-size:17px;margin:0 0 8px}.tag{color:var(--pink);font-size:12px}label{display:block;font-size:13px;color:#d8cdd4;margin:12px 0 5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 system-ui}dialog{background:#1d1b20;color:var(--txt);border:1px solid #5a4b59;border-radius:15px;width:min(800px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}.warning{background:#30232b;border-left:3px solid var(--pink);padding:12px;margin:14px 0}#notice{min-height:24px;color:var(--pink)}.ph{position:relative}.sig{position:absolute;right:10px;bottom:8px;font:italic 12px/1 Georgia,serif;letter-spacing:.04em;color:#fff;opacity:.78;text-shadow:0 1px 3px #000c;pointer-events:none}@media(max-width:700px){header{padding:18px}main{padding:20px 12px}}
header{flex-direction:column;align-items:center;text-align:center;padding:42px 5vw 26px;border-bottom:0;position:relative}
header:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(320px,60vw);height:1px;background:linear-gradient(90deg,transparent,var(--pink),transparent)}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(30px,5vw,46px);letter-spacing:.08em}
h1 em{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500}
header small{display:block;margin-top:6px;letter-spacing:.22em;text-transform:uppercase;font-size:11px}
header .row{margin-top:14px}header .row a{font-size:13px;letter-spacing:.12em;text-decoration:none;border:1px solid #4b414b;padding:9px 14px;border-radius:9px}
#grid{columns:4 260px;column-gap:18px;display:block!important}
.tile{break-inside:avoid;margin:0 0 18px;display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--panel);position:relative;cursor:pointer;text-align:left;color:var(--txt);box-shadow:0 6px 20px #0006;transition:transform .35s,box-shadow .35s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px #000a;filter:none}
.tile img{width:100%;height:auto;display:block;transition:transform .6s}
.tile:hover img{transform:scale(1.035)}
.tile .placeholder{height:auto;aspect-ratio:4/5}
.tile .ov{position:absolute;inset:auto 0 0 0;padding:46px 16px 14px;background:linear-gradient(transparent,#000d 70%);opacity:0;transform:translateY(8px);transition:.35s}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1;transform:none}
.tile .ov h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:18px;margin:2px 0 0;line-height:1.25}
.tile .ov .tag{text-transform:uppercase;letter-spacing:.14em;font-size:10.5px}
.tile .sig{transition:opacity .35s}.tile:hover .sig{opacity:0}
.tile:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
#dt{font-family:'Playfair Display',Georgia,serif;font-weight:500}
@media(hover:none){.tile .ov{opacity:1;transform:none;padding:34px 12px 10px}.tile .ov h3{font-size:15px}.tile .sig{display:none}}
@media(max-width:700px){#grid{columns:2;column-gap:10px}.tile{margin-bottom:10px}header{padding:28px 14px 20px}}
</style></head><body><header><div><h1>KWESTIA <em>ZŁUDZEŃ</em></h1><small>Fotografia wyobraźni · Kadry AI</small></div><div class="row"><button id="favOnly">Ulubione</button></div></header><main><div class="row" style="margin-bottom:20px"><input id="q" placeholder="Szukaj po tytule, opisie i tagach" style="max-width:420px"><select id="cat" style="max-width:200px"><option value="">Wszystkie kategorie</option><option>Kobieta</option><option>Mężczyzna</option><option>Unisex</option><option>Zwierzęta</option></select><label style="margin:0"><input type="checkbox" id="showDrafts" style="width:auto"> Pokaż także publiczne szkice bez miniatur</label></div><p id="count" class="muted"></p><div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px"></div></main><dialog id="dlg"><div class="row" style="justify-content:space-between"><h2 id="dt"></h2><button onclick="dlg.close()">Zamknij</button></div><p id="meta" class="muted"></p><p id="desc"></p><h3>Prompt</h3><pre id="prompt"></pre><h3>Negative prompt</h3><pre id="negative"></pre><p id="refs" class="muted"></p><div class="row"><button class="primary" id="copy">Kopiuj prompt</button><button id="chat">Użyj w ChatGPT</button><button id="favorite">☆ Ulubione</button></div><p class="muted">W ChatGPT wklej skopiowany prompt i dołącz swoje zdjęcie referencyjne. Nie przekazujemy prywatnych zdjęć przez tę stronę.</p></dialog><script>
let all=[], selected=null,onlyFav=false;let favorites=new Set(JSON.parse(localStorage.getItem('kz_favorites')||'[]'));const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let r=await fetch('kadry.json?cache='+Date.now());if(!r.ok)throw Error('Brak pliku kadry.json');let d=await r.json();all=d.kadry||[];render()}catch(e){$('count').textContent='Nie udało się wczytać katalogu: '+e.message}}
function render(){let q=$('q').value.toLowerCase(),cat=$('cat').value;let visible=all.filter(x=>(x.status==='published'||($('showDrafts').checked&&x.status==='public_draft'))&&(!cat||x.category===cat)&&(!onlyFav||favorites.has(x.id))&&[x.title,x.description,x.tags].join(' ').toLowerCase().includes(q));$('count').textContent=`${visible.length} Kadrów · ${all.length} w katalogu · ${all.filter(x=>x.status==='published').length} opublikowanych`; $('grid').innerHTML=visible.map(x=>`<button class="tile" data-id="${esc(x.id)}" aria-label="${esc(x.title)} — zobacz prompt">${x.thumbnail?`<img src="${esc(x.thumbnail)}" alt="${esc(x.title)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'Nie znaleziono zdjęcia — sprawdź ścieżkę'}))"><span class="sig">Kwestia złudzenia</span>`:`<div class="placeholder">Miniatura do uzupełnienia</div>`}<div class="ov"><div class="tag">${esc(x.category)}${x.status==='public_draft'?' · SZKIC':''}</div><h3>${esc(x.title)}</h3></div></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openItem(b.dataset.id))}
function openItem(id){selected=all.find(x=>x.id===id);if(!selected)return;$('dt').textContent=selected.title;$('meta').textContent=selected.category+' · '+(selected.status==='published'?'Opublikowany':'Szkic publiczny');$('desc').textContent=selected.description||'';$('prompt').textContent=selected.prompt;$('negative').textContent=selected.negativePrompt||'Brak';$('refs').textContent='Zdjęcia referencyjne: '+(selected.referencePhotosRequired||'według promptu');$('favorite').textContent=favorites.has(id)?'★ Usuń z ulubionych':'☆ Ulubione';$('dlg').showModal()}
$('copy').onclick=async()=>{await navigator.clipboard.writeText(selected.prompt);$('copy').textContent='Skopiowano';setTimeout(()=>$('copy').textContent='Kopiuj prompt',1800)};$('chat').onclick=async()=>{try{await navigator.clipboard.writeText(selected.prompt)}catch(e){}window.open('https://chatgpt.com/','_blank','noopener')};$('favorite').onclick=()=>{favorites.has(selected.id)?favorites.delete(selected.id):favorites.add(selected.id);localStorage.setItem('kz_favorites',JSON.stringify([...favorites]));openItem(selected.id);render()};$('favOnly').onclick=()=>{onlyFav=!onlyFav;$('favOnly').textContent=onlyFav?'Wszystkie':'Ulubione';render()};['q','cat','showDrafts'].forEach(id=>$(id).addEventListener('input',render));load();
</script></body></html>
