<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KWESTIA ZŁUDZEŃ — Kadry</title><style>:root{color-scheme:dark;--bg:#111114;--panel:#1d1c20;--line:#37333a;--txt:#f4eff0;--muted:#aaa1aa;--pink:#eab1c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Arial}a{color:var(--pink)}button,input,select,textarea{font:inherit}button{background:#302b33;border:1px solid #4b414b;color:var(--txt);padding:10px 14px;border-radius:9px;cursor:pointer}button.primary{background:var(--pink);color:#24151d;font-weight:700}button:hover{filter:brightness(1.12)}input,select,textarea{background:#151418;border:1px solid #49414a;color:var(--txt);padding:10px;border-radius:8px;width:100%}textarea{min-height:145px;resize:vertical}header{padding:24px 5vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px;letter-spacing:.03em}h1 em{color:var(--pink);font-family:Georgia,serif}small,.muted{color:var(--muted)}main{max-width:1300px;margin:auto;padding:30px 5vw}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.card img,.placeholder{width:100%;height:255px;object-fit:cover;display:block}.placeholder{display:grid;place-items:center;color:#8d808c;background:linear-gradient(135deg,#252126,#17171b);text-align:center;padding:20px}.card section{padding:15px}.card h3{font-size:17px;margin:0 0 8px}.tag{color:var(--pink);font-size:12px}label{display:block;font-size:13px;color:#d8cdd4;margin:12px 0 5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 system-ui}dialog{background:#1d1b20;color:var(--txt);border:1px solid #5a4b59;border-radius:15px;width:min(800px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}.warning{background:#30232b;border-left:3px solid var(--pink);padding:12px;margin:14px 0}#notice{min-height:24px;color:var(--pink)}@media(max-width:700px){header{padding:18px}main{padding:20px 12px}}</style></head><body><header><div><h1>KWESTIA <em>ZŁUDZEŃ</em></h1><small>Fotografia wyobraźni · Kadry AI</small></div><div class="row"><a href="studio/">STUDIO</a><button id="favOnly">Ulubione</button></div></header><main><div class="row" style="margin-bottom:20px"><input id="q" placeholder="Szukaj po tytule, opisie i tagach" style="max-width:420px"><select id="cat" style="max-width:200px"><option value="">Wszystkie kategorie</option><option>Kobieta</option><option>Mężczyzna</option><option>Unisex</option><option>Zwierzęta</option></select><label style="margin:0"><input type="checkbox" id="showDrafts" style="width:auto"> Pokaż także publiczne szkice bez miniatur</label></div><p id="count" class="muted"></p><div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px"></div></main><dialog id="dlg"><div class="row" style="justify-content:space-between"><h2 id="dt"></h2><button onclick="dlg.close()">Zamknij</button></div><p id="meta" class="muted"></p><p id="desc"></p><h3>Prompt</h3><pre id="prompt"></pre><h3>Negative prompt</h3><pre id="negative"></pre><p id="refs" class="muted"></p><div class="row"><button class="primary" id="copy">Kopiuj prompt</button><button id="chat">Użyj w ChatGPT</button><button id="favorite">☆ Ulubione</button></div><p class="muted">W ChatGPT wklej skopiowany prompt i dołącz swoje zdjęcie referencyjne. Nie przekazujemy prywatnych zdjęć przez tę stronę.</p></dialog><script>
let all=[], selected=null,onlyFav=false;let favorites=new Set(JSON.parse(localStorage.getItem('kz_favorites')||'[]'));const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let r=await fetch('kadry.json?cache='+Date.now());if(!r.ok)throw Error('Brak pliku kadry.json');let d=await r.json();all=d.kadry||[];render()}catch(e){$('count').textContent='Nie udało się wczytać katalogu: '+e.message}}
function render(){let q=$('q').value.toLowerCase(),cat=$('cat').value;let visible=all.filter(x=>(x.status==='published'||($('showDrafts').checked&&x.status==='public_draft'))&&(!cat||x.category===cat)&&(!onlyFav||favorites.has(x.id))&&[x.title,x.description,x.tags].join(' ').toLowerCase().includes(q));$('count').textContent=`${visible.length} Kadrów · ${all.length} w katalogu · ${all.filter(x=>x.status==='published').length} opublikowanych`; $('grid').innerHTML=visible.map(x=>`<article class="card">${x.thumbnail?`<img src="${esc(x.thumbnail)}" alt="${esc(x.title)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'Nie znaleziono zdjęcia — sprawdź ścieżkę'}))">`:`<div class="placeholder">Miniatura do uzupełnienia</div>`}<section><div class="tag">${esc(x.category)} ${x.status==='public_draft'?'· SZKIC':''}</div><h3>${esc(x.title)}</h3><button data-id="${esc(x.id)}">Zobacz prompt</button></section></article>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openItem(b.dataset.id))}
function openItem(id){selected=all.find(x=>x.id===id);if(!selected)return;$('dt').textContent=selected.title;$('meta').textContent=selected.category+' · '+(selected.status==='published'?'Opublikowany':'Szkic publiczny');$('desc').textContent=selected.description||'';$('prompt').textContent=selected.prompt;$('negative').textContent=selected.negativePrompt||'Brak';$('refs').textContent='Zdjęcia referencyjne: '+(selected.referencePhotosRequired||'według promptu');$('favorite').textContent=favorites.has(id)?'★ Usuń z ulubionych':'☆ Ulubione';$('dlg').showModal()}
$('copy').onclick=async()=>{await navigator.clipboard.writeText(selected.prompt);$('copy').textContent='Skopiowano';setTimeout(()=>$('copy').textContent='Kopiuj prompt',1800)};$('chat').onclick=async()=>{try{await navigator.clipboard.writeText(selected.prompt)}catch(e){}window.open('https://chatgpt.com/','_blank','noopener')};$('favorite').onclick=()=>{favorites.has(selected.id)?favorites.delete(selected.id):favorites.add(selected.id);localStorage.setItem('kz_favorites',JSON.stringify([...favorites]));openItem(selected.id);render()};$('favOnly').onclick=()=>{onlyFav=!onlyFav;$('favOnly').textContent=onlyFav?'Wszystkie':'Ulubione';render()};['q','cat','showDrafts'].forEach(id=>$(id).addEventListener('input',render));load();
</script></body></html>
